spring.application.name=config-server-grupo03

server.port=8888

spring.cloud.config.server.git.uri=https://github.com/Cibertec-DAWII-T2-Grupo03/config-default-grupo03.git
spring.cloud.config.server.git.default-label=main

spring.cloud.config.server.git.repos.comercial.pattern[0]=solicitud-*
spring.cloud.config.server.git.repos.comercial.uri=https://github.com/Cibertec-DAWII-T2-Grupo03/config-comercial-grupo03.git
spring.cloud.config.server.git.repos.comercial.default-label=main

spring.cloud.config.server.git.repos.riesgos.pattern[0]=evaluacion-*
spring.cloud.config.server.git.repos.riesgos.uri=https://github.com/Cibertec-DAWII-T2-Grupo03/config-riesgos-grupo03.git
spring.cloud.config.server.git.repos.riesgos.default-label=main

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

management.endpoints.web.exposure.include=health,info
