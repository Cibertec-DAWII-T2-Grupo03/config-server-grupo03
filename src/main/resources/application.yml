spring:
  application:
    name: config-server-grupo03
  cloud:
    config:
      server:
        git:
          uri: https://github.com/Cibertec-DAWII-T2-Grupo03/config-repo-default-grupo03.git
          default-label: main
          repos:
            comercial:
              pattern:
                - 'solicitud-*'
              uri: https://github.com/Cibertec-DAWII-T2-Grupo03/config-repo-comercial-grupo03.git
              default-label: main
            riesgos:
              pattern:
                - 'evaluacion-*'
              uri: https://github.com/Cibertec-DAWII-T2-Grupo03/config-repo-riesgos-grupo03.git
              default-label: main

server:
  port: 8888

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info
